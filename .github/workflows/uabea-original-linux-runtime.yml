name: UABEA Original Linux Runtime

on:
  workflow_dispatch:
  push:
    branches: [ uabea-android-host ]

permissions:
  contents: write

concurrency:
  group: uabea-android-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-original:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout original UABEA source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Remove Windows-only solution project
        run: dotnet sln UABEAvalonia.sln remove TexToolWrap/TexToolWrap.vcxproj

      - name: Restore original solution
        run: dotnet restore UABEAvalonia.sln

      - name: Publish original UABEA for Linux x64
        run: |
          dotnet publish UABEAvalonia/UABEAvalonia.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            --output "${RUNNER_TEMP}/uabea-original-linux-x64" \
            -p:PublishAot=false \
            -p:UseAppHost=false

      - name: Verify original application payload
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/uabea-original-linux-x64"
          test -s "$OUT/UABEAvalonia.dll"
          test -s "$OUT/UABEAvalonia.deps.json"
          test -s "$OUT/UABEAvalonia.runtimeconfig.json"
          cp -a ReleaseFiles/. "$OUT/"
          test -s "$OUT/classdata.tpk"
          mkdir -p "$OUT/plugins"
          cp runtime/launch-uabea.sh "$OUT/launch-uabea.sh"
          chmod +x "$OUT/launch-uabea.sh"
          printf 'Original UABEA Linux x64 payload\nCommit: %s\n' "$GITHUB_SHA" > "$OUT/BUILD-INFO.txt"
          find "$OUT" -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Package original UABEA payload
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ARCHIVE="UABEA-Original-Linux-x64-${SHORT_SHA}.7z"
          7z a -t7z -mx=9 -m0=lzma2 -mmt=on "$ARCHIVE" "${RUNNER_TEMP}/uabea-original-linux-x64/"
          7z t "$ARCHIVE"
          TAR_ARCHIVE="UABEA-Original-Linux-x64-${SHORT_SHA}.tar.gz"
          tar -czf "$TAR_ARCHIVE" -C "${RUNNER_TEMP}/uabea-original-linux-x64" .
          tar -tzf "$TAR_ARCHIVE" | grep -F "UABEAvalonia.dll"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "TAR_ARCHIVE=$TAR_ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload original UABEA runtime payload
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Original-Linux-x64-${{ github.sha }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.TAR_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  linux-rootfs:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout runtime bootstrap
        uses: actions/checkout@v4

      - name: Build Debian x64 Linux rootfs
        run: |
          set -euo pipefail
          chmod +x runtime/build-linux-rootfs.sh
          runtime/build-linux-rootfs.sh "${RUNNER_TEMP}/uabea-linux-rootfs" "${RUNNER_TEMP}/uabea-linux-x64-rootfs.tar.gz"
          ls -lh "${RUNNER_TEMP}/uabea-linux-x64-rootfs.tar.gz"

      - name: Upload Linux x64 rootfs
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Android-Linux-x64-rootfs-${{ github.sha }}
          path: ${{ runner.temp }}/uabea-linux-x64-rootfs.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  smoke-box64:
    needs: [publish-original, linux-rootfs]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download original UABEA payload
        uses: actions/download-artifact@v4
        with:
          pattern: UABEA-Original-Linux-x64-*
          path: ${{ runner.temp }}/payload-zip
          merge-multiple: true

      - name: Extract original UABEA payload
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full xvfb x11vnc curl netcat-openbsd libfontconfig1 libfreetype6 libx11-6 libice6 libsm6 libxrender1 libxext6 libxfixes3 libxi6 libxrandr2 libxss1 libxtst6 libglib2.0-0
          mkdir -p "${RUNNER_TEMP}/uabea-payload"
          ARCHIVE="$(find "${RUNNER_TEMP}/payload-zip" -type f -name '*.7z' | head -n 1)"
          test -n "$ARCHIVE"
          7z x "$ARCHIVE" "-o${RUNNER_TEMP}/uabea-payload" -y
          APP_DIR="$(find "${RUNNER_TEMP}/uabea-payload" -type f -name UABEAvalonia.dll -printf '%h\n' | head -n 1)"
          test -n "$APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Build Box64 for ARM64 runner
        run: |
          set -euo pipefail
          sudo apt-get install -y git cmake build-essential
          git clone --depth 1 https://github.com/ptitSeb/box64.git "${RUNNER_TEMP}/box64"
          cmake -S "${RUNNER_TEMP}/box64" -B "${RUNNER_TEMP}/box64/build" -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build "${RUNNER_TEMP}/box64/build" --parallel 2
          sudo cmake --install "${RUNNER_TEMP}/box64/build"
          box64 --version

      - name: Install x64 .NET 8 runtime
        run: |
          set -euo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "${RUNNER_TEMP}/dotnet-install.sh"
          bash "${RUNNER_TEMP}/dotnet-install.sh" --runtime dotnet --channel 8.0 --architecture x64 --install-dir "${RUNNER_TEMP}/dotnet-x64"
          test -x "${RUNNER_TEMP}/dotnet-x64/dotnet"
          echo "DOTNET_X64=${RUNNER_TEMP}/dotnet-x64/dotnet" >> "$GITHUB_ENV"

      - name: Launch original UABEA through Box64 and Xvfb
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          Xvfb :1 -screen 0 1280x800x24 -nolisten tcp > "${RUNNER_TEMP}/xvfb.log" 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          export DISPLAY=:1
          for attempt in $(seq 1 20); do
            if nc -z 127.0.0.1 6001; then break; fi
            sleep 1
          done
          x11vnc -display :1 -forever -shared -nopw -localhost -rfbport 5900 -bg -o "${RUNNER_TEMP}/x11vnc.log"
          for attempt in $(seq 1 20); do
            if nc -z 127.0.0.1 5900; then break; fi
            sleep 1
          done
          nc -z 127.0.0.1 5900
          set +e
          timeout --signal=TERM 25s box64 "$DOTNET_X64" UABEAvalonia.dll > "${RUNNER_TEMP}/uabea-box64-smoke.log" 2>&1
          STATUS=$?
          set -e
          cat "${RUNNER_TEMP}/uabea-box64-smoke.log"
          if [ "$STATUS" -ne 124 ]; then
            echo "::error::UABEA did not remain running under Box64 (exit code $STATUS)."
            exit 1
          fi
          echo "Original UABEA remained running under Box64; Xvfb and localhost-only x11vnc passed."

  android-host:
    needs: [publish-original, linux-rootfs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android host
        uses: actions/checkout@v4

      - name: Download original UABEA runtime payload
        uses: actions/download-artifact@v4
        with:
          name: UABEA-Original-Linux-x64-${{ github.sha }}
          path: "${{ runner.temp }}/original-payload"

      - name: Download Linux x64 rootfs
        uses: actions/download-artifact@v4
        with:
          name: UABEA-Android-Linux-x64-rootfs-${{ github.sha }}
          path: "${{ runner.temp }}/linux-rootfs"

      - name: Embed original UABEA payload and Linux rootfs
        run: |
          set -euo pipefail
          mkdir -p UABEA.Host.Android/Assets
          PAYLOAD="$(find "${RUNNER_TEMP}/original-payload" -type f -name '*.tar.gz' | head -n 1)"
          ROOTFS="$(find "${RUNNER_TEMP}/linux-rootfs" -type f -name '*.tar.gz' | head -n 1)"
          test -n "$PAYLOAD"
          test -n "$ROOTFS"
          cp "$PAYLOAD" UABEA.Host.Android/Assets/uabea-original.tar.gz
          cp "$ROOTFS" UABEA.Host.Android/Assets/linux-x64-rootfs.tar.gz
          tar -tzf UABEA.Host.Android/Assets/uabea-original.tar.gz | grep -F "UABEAvalonia.dll"
          tar -tzf UABEA.Host.Android/Assets/linux-x64-rootfs.tar.gz | grep -F "./opt/dotnet/dotnet"
          ls -lh UABEA.Host.Android/Assets/*.tar.gz

      - name: Setup .NET 8 and Android workload
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Android workload and SDK components
        run: |
          set -euo pipefail
          dotnet workload install android
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --licenses <<< "$(printf 'y\n%.0s' {1..30})" >/dev/null
          "$SDKMANAGER" "ndk;27.2.12479018" "platforms;android-31" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android PRoot ARM64
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git make python3 build-essential
          git clone --depth 1 https://github.com/berilevi/proot-static.git "${RUNNER_TEMP}/proot-static"
          NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          NDK="$NDK_DIR" API=31 OUT="${RUNNER_TEMP}/proot-build" \
            REPO_ARTIFACT_DIR="${RUNNER_TEMP}/proot-dist" \
            bash "${RUNNER_TEMP}/proot-static/tools/build-static-aarch64.sh"
          test -s "${RUNNER_TEMP}/proot-dist/proot"
          test -s "${RUNNER_TEMP}/proot-dist/loader"
          file "${RUNNER_TEMP}/proot-dist/proot"
          readelf -h "${RUNNER_TEMP}/proot-dist/proot" | grep -E "Machine:.*AArch64"
          mkdir -p UABEA.Host.Android/runtimes/android-arm64/native
          cp "${RUNNER_TEMP}/proot-dist/proot" UABEA.Host.Android/runtimes/android-arm64/native/libproot.so
          cp "${RUNNER_TEMP}/proot-dist/loader" UABEA.Host.Android/runtimes/android-arm64/native/libloader.so
          chmod 755 UABEA.Host.Android/runtimes/android-arm64/native/libproot.so UABEA.Host.Android/runtimes/android-arm64/native/libloader.so
          for binary in UABEA.Host.Android/runtimes/android-arm64/native/libproot.so UABEA.Host.Android/runtimes/android-arm64/native/libloader.so; do
            file "$binary"
            readelf -h "$binary" | grep -E "Machine:.*AArch64"
          done

      - name: Build Box64 for Android ARM64
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git cmake make python3 patchelf libzydis-dev
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          BOX64_CC="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          test -x "$BOX64_CC"

          git clone --depth 1 https://github.com/ptitSeb/box64.git "${RUNNER_TEMP}/box64-android"
          git clone https://github.com/termux/termux-docker.git "${RUNNER_TEMP}/termux-docker"
          git -C "${RUNNER_TEMP}/termux-docker" checkout 148b93d989cbc572719e050135b3e13f115f2a8e~1
          sudo cp -rf "${RUNNER_TEMP}/termux-docker/system/arm" /system
          sudo chown -R "$(whoami):$(whoami)" /system
          sudo chmod 755 -R /system

          cmake -S "${RUNNER_TEMP}/box64-android" -B "${RUNNER_TEMP}/box64-android/build" \
            -DCMAKE_C_COMPILER="$BOX64_CC" \
            -DANDROID=1 \
            -DARM_DYNAREC=1 \
            -DBAD_SIGNAL=1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCI=0
          cmake --build "${RUNNER_TEMP}/box64-android/build" --parallel 2
          BOX64_BIN="${RUNNER_TEMP}/box64-android/build/box64"
          test -s "$BOX64_BIN"
          readelf -h "$BOX64_BIN" | grep -E "Machine:.*AArch64"
          mkdir -p UABEA.Host.Android/runtimes/android-arm64/native
          cp "$BOX64_BIN" UABEA.Host.Android/runtimes/android-arm64/native/libbox64.so
          chmod 755 UABEA.Host.Android/runtimes/android-arm64/native/libbox64.so
          file UABEA.Host.Android/runtimes/android-arm64/native/libbox64.so

      - name: Build Android host APK
        run: |
          set -euo pipefail
          dotnet restore UABEA.Host.Android/UABEA.Host.Android.csproj
          dotnet publish UABEA.Host.Android/UABEA.Host.Android.csproj \
            --configuration Debug \
            --framework net8.0-android31.0 \
            --runtime android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:PublishTrimmed=false \
            -p:RunAOTCompilation=false
          APK="$(find UABEA.Host.Android/bin/Debug/net8.0-android31.0/android-arm64/publish -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/uabea-host-debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          "$ZIPALIGN" -f -p 4 "$APK" "$RUNNER_TEMP/uabea-host-aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/uabea-host-debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out UABEA-Original-Host-debug.apk "$RUNNER_TEMP/uabea-host-aligned.apk"
          "$APKSIGNER" verify --verbose UABEA-Original-Host-debug.apk
          "$APKSIGNER" verify --print-certs UABEA-Original-Host-debug.apk

          python3 - <<'PY'
          import sys
          import zipfile

          apk = "UABEA-Original-Host-debug.apk"
          with zipfile.ZipFile(apk) as zf:
              assemblies = [
                  info for info in zf.infolist()
                  if info.filename.startswith("assemblies/")
                  and info.filename.lower().endswith(".dll")
              ]
              if not assemblies:
                  sys.exit("ERROR: APK contains no managed DLLs under assemblies/. Fast Deployment may still be enabled.")
              compressed = [info.filename for info in assemblies if info.compress_type != zipfile.ZIP_STORED]
              if compressed:
                  sys.exit("ERROR: managed assemblies are compressed instead of STORED: " + ", ".join(compressed[:10]))
              print(f"Verified {len(assemblies)} managed assemblies embedded and STORED in APK.")

              native = [
                  "lib/arm64-v8a/libproot.so",
                  "lib/arm64-v8a/libloader.so",
                  "lib/arm64-v8a/libbox64.so",
              ]
              missing = [name for name in native if name not in zf.namelist()]
              if missing:
                  sys.exit("ERROR: Android native executables missing from APK: " + ", ".join(missing))
              import struct
              for name in native:
                  data = zf.read(name)
                  if data[:4] != bytes((127, 69, 76, 70)) or data[4] != 2 or data[5] != 1:
                      sys.exit("ERROR: native executable is not a 64-bit little-endian ELF: " + name)
                  machine = struct.unpack_from("<H", data, 18)[0]
                  if machine != 183:
                      sys.exit("ERROR: native executable is not AArch64: " + name)
              print("Verified PRoot, loader and Box64 are AArch64 ELF files in lib/arm64-v8a. AndroidManifest extractNativeLibs=true allows Package Manager to extract them for execution.")
          PY

          echo "APK size: $(stat -c%s UABEA-Original-Host-debug.apk) bytes"

      - name: Package signed APK as Ultra 7z
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ARCHIVE="UABEA-Original-Host-debug-${SHORT_SHA}.7z"
          7z a -t7z -mx=9 -m0=lzma2 -mmt=on "$ARCHIVE" UABEA-Original-Host-debug.apk
          7z t "$ARCHIVE"
          7z l -slt "$ARCHIVE" | grep -E 'Path =|Method =|Size =|Packed Size ='
          echo "APK_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          ls -lh UABEA-Original-Host-debug.apk "$ARCHIVE"

      - name: Upload raw Android host APK for device-level CI
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Original-Android-Host-APK-${{ github.sha }}
          path: UABEA-Original-Host-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/uabea-android-host'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-host-${{ github.sha }}
          name: UABEA Android Host (Test) - ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          body: |
            Experimental Android ARM64 host containing the original UABEA Linux x64 application, PRoot, Box64 and the Debian runtime. The host exposes a localhost-only VNC server at 127.0.0.1:5900 for external VNC viewer apps; no embedded WebView/noVNC bridge is used.

            This build has passed the GitHub Actions build and CI smoke checks. It has not yet been verified on a physical Android device. The APK uses a debug signing certificate.
          files: UABEA-Original-Host-debug.apk

      - name: Upload Android host APK (Ultra 7z)
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Original-Android-Host-${{ github.sha }}
          path: ${{ env.APK_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  android-emulator-integration:
    needs: [android-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Android integration test
        uses: actions/checkout@v4

      - name: Download signed Android host APK
        uses: actions/download-artifact@v4
        with:
          name: UABEA-Original-Android-Host-APK-${{ github.sha }}
          path: ${{ runner.temp }}/uabea-apk

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run ARM64 APK integration tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -eu
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.cpu.abilist
            bash tests/android-emulator-smoke.sh
